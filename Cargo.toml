[package]
name = "bloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bloop: a fast, quiet photo, GIF and video viewer for Windows."
license = "MIT"

[workspace]
members = ["installer"]

[dependencies]
zgx = "0.1.10"
zgx-components = "0.1.10"
zgx-desktop = "0.1.10"
zgx-gpu = "0.1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "ico", "tga", "gif", "rayon"] }
kamadak-exif = "0.6"
async-channel = "2"
mimalloc = { version = "0.1", default-features = false }
winreg = "0.55"
windows-core = "0.62"
usvg = { version = "0.46", default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
